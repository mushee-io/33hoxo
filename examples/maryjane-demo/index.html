<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>33HOXO × Mary Jane</title><style>body{font-family:system-ui;background:#0b0b0d;color:#f5f5f5;margin:0;padding:40px}main{max-width:800px;margin:auto}.card{background:#15151a;border:1px solid #303038;border-radius:18px;padding:22px;margin:18px 0}input,select,button{padding:10px;margin:5px;border-radius:9px;background:#1d1d23;color:#fff;border:1px solid #444}button{background:#fff;color:#111;font-weight:700}code{word-break:break-all;color:#b9f6ca}</style></head><body><main><h1>33HOXO × Mary Jane</h1><p>Judge-facing confidentiality boundary preview. Production encryption is performed by the TypeScript SDK.</p><div class="card"><select id="side"><option>YES</option><option>NO</option></select><select id="action"><option>BUY</option><option>SELL</option></select><input id="price" value="6200"><input id="qty" value="500000000"><button id="seal">Preview sealed order</button></div><div class="card" id="proof" hidden><h2>Protected by Shutter</h2><p>Commitment: <code id="commitment"></code></p><p id="private"></p><p>Gateway sees ciphertext + commitment + reveal metadata, not the plaintext order.</p></div></main><script>seal.onclick=()=>{const r=crypto.getRandomValues(new Uint8Array(32));commitment.textContent="0x"+[...r].map(x=>x.toString(16).padStart(2,"0")).join("");private.textContent="Local trader view: "+action.value+" "+side.value+" / "+qty.value+" units / "+price.value+" bps";proof.hidden=false}</script></body></html>
